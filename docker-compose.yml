services:
  # PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: survey-postgres
    environment:
      POSTGRES_DB: survey_chat
      POSTGRES_USER: survey_user
      POSTGRES_PASSWORD: survey_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey_user -d survey_chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - survey-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: survey-backend
    environment:
      DATABASE_URL: postgresql://survey_user:changeme_secure_password_here@postgres:5432/survey_chat
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SERVER_SALT: ${SERVER_SALT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEBUG: "True"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - survey-network

  # Frontend (optional - served by Netlify in production)
  # For local development, serve static files from backend or use simple-http-server
  frontend:
    image: python:3.11-slim
    container_name: survey-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: python -m http.server 3000
    networks:
      - survey-network

volumes:
  postgres_data:

networks:
  survey-network:
    driver: bridge
